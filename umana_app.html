<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>UMANA Ginecología</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.11.1/lib/msal-browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1628;--navy2:#1B3A6B;--navy3:#22488a;
  --teal:#2ABFBF;--teal2:rgba(42,191,191,.15);
  --w:#fff;--g1:#f4f6fb;--g2:#e2e8f4;--g4:#94a3b8;--g6:#64748b;
  --red:#e53e3e;--green:#38a169;
  --font:'Segoe UI',system-ui,sans-serif;
  --r:10px;--sh:0 2px 12px rgba(11,22,40,.13);--shl:0 8px 32px rgba(11,22,40,.2)
}
body{font-family:var(--font);background:var(--g1);color:var(--navy);min-height:100vh}

/* ── OVERLAY DE MODO ── */
#overlay-modo{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center}
.modo-card{background:rgba(255,255,255,.06);border:1px solid rgba(42,191,191,.35);border-radius:20px;padding:52px 44px;text-align:center;max-width:460px;width:90%}
.modo-card h1{color:#fff;font-size:2rem;font-weight:700;margin-bottom:6px}
.modo-card p{color:var(--teal);margin-bottom:36px}
.modo-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.modo-btn{padding:13px 28px;border-radius:9px;border:none;cursor:pointer;font-size:.97rem;font-weight:700;transition:.18s}
.modo-btn.p{background:var(--teal);color:var(--navy)}
.modo-btn.s{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.modo-btn:hover{opacity:.82;transform:translateY(-1px)}

/* ── HEADER ── */
#app{display:none}
header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:0 22px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.hl{display:flex;align-items:center;gap:12px}
.logo{font-size:1.2rem;font-weight:700}.logo span{color:var(--teal)}
.badge{background:var(--teal2);border:1px solid var(--teal);color:var(--teal);font-size:.68rem;padding:2px 8px;border-radius:20px;font-weight:700}
.hr{display:flex;align-items:center;gap:10px;position:relative}
.dot{width:8px;height:8px;border-radius:50%}
.dot.g{background:var(--green)}.dot.r{background:var(--red)}
#sess-btn{background:none;border:none;color:rgba(255,255,255,.75);font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:6px}
.sess-dd{position:absolute;top:32px;right:0;background:var(--navy2);border:1px solid rgba(42,191,191,.3);border-radius:8px;padding:6px;min-width:150px;display:none;z-index:200}
.sess-dd.open{display:block}
.sess-dd button{width:100%;text-align:left;background:none;border:none;color:#fff;padding:8px 12px;cursor:pointer;font-size:.85rem;border-radius:5px}
.sess-dd button:hover{background:var(--teal2)}

/* ── BANNER ── */
#banner{background:var(--red);color:#fff;text-align:center;padding:7px;font-size:.83rem;font-weight:700;display:none;position:sticky;top:56px;z-index:99}
#banner button{margin-left:10px;background:#fff;color:var(--red);border:none;padding:2px 10px;border-radius:4px;cursor:pointer;font-weight:700}

/* ── TABS ── */
nav{background:var(--navy2);display:flex;padding:0 22px;overflow-x:auto}
nav button{background:none;border:none;color:rgba(255,255,255,.6);padding:13px 18px;font-size:.88rem;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.18s;font-family:var(--font)}
nav button.act{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}
nav button:hover:not(.act){color:rgba(255,255,255,.9)}
#consulta-bar{background:var(--navy);padding:9px 22px;display:none;align-items:center;gap:10px}
#consulta-bar label{color:var(--teal);font-size:.83rem;font-weight:700}
#consulta-dr{background:rgba(255,255,255,.1);border:1px solid rgba(42,191,191,.3);color:#fff;padding:5px 10px;border-radius:6px;font-size:.88rem}

/* ── MAIN ── */
main{padding:22px;max-width:1080px;margin:0 auto}

/* ── CARD ── */
.card{background:var(--w);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:18px}
.ct{font-size:.97rem;font-weight:700;color:var(--navy2);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.ct::before{content:'';width:4px;height:17px;background:var(--teal);border-radius:2px;flex-shrink:0}

/* ── FORM ── */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fi{display:flex;flex-direction:column;gap:5px}
.fi.full{grid-column:1/-1}
.lbl{font-size:.76rem;font-weight:700;color:var(--g6);text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{border:1.5px solid var(--g2);border-radius:7px;padding:9px 11px;font-size:.91rem;font-family:var(--font);color:var(--navy);transition:.18s;background:var(--w);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(42,191,191,.13)}
input:disabled{background:var(--g1);color:var(--g4);cursor:not-allowed}
textarea{resize:vertical;min-height:68px}
.mon{position:relative}.mon span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--g4);font-weight:700;pointer-events:none}
.mon input{padding-left:22px}

/* ── 2do pago ── */
.btn-add2{background:none;border:1.5px dashed var(--teal);color:var(--teal);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:.82rem;font-weight:700;margin-top:4px;transition:.18s;width:auto}
.btn-add2:hover{background:var(--teal2)}
.wrap2{margin-top:8px;padding:12px;background:var(--g1);border-radius:8px;position:relative;display:none}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rm2{position:absolute;top:7px;right:9px;background:none;border:none;color:var(--red);cursor:pointer;font-size:1.1rem}

/* ── FACTURA ── */
.fac{margin-top:12px;padding:12px;background:var(--g1);border-radius:8px}
.cbrow{display:flex;align-items:center;gap:8px;cursor:pointer}
.cbrow input[type=checkbox]{width:16px;height:16px;accent-color:var(--teal);cursor:pointer;flex-shrink:0}
.cbrow span{font-size:.9rem;color:var(--navy);font-weight:500}

/* ── BOTONES ── */
.btn{padding:9px 20px;border-radius:7px;border:none;cursor:pointer;font-weight:700;font-size:.88rem;transition:.18s;font-family:var(--font)}
.btn-p{background:var(--teal);color:var(--navy)}.btn-p:hover{opacity:.85}
.btn-s{background:var(--navy2);color:#fff}.btn-s:hover{background:var(--navy3)}
.btn-d{background:var(--red);color:#fff}
.btn-sm{padding:5px 11px;font-size:.78rem}
.bico{background:none;border:none;cursor:pointer;padding:3px 6px;border-radius:5px;font-size:.9rem}
.bico:hover{background:var(--g1)}

/* ── TABLA ── */
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{background:var(--navy2);color:#fff;padding:9px 11px;text-align:left;font-size:.77rem;text-transform:uppercase;letter-spacing:.3px;font-weight:700}
td{padding:8px 11px;border-bottom:1px solid var(--g2);vertical-align:middle}
tr:hover td{background:var(--g1)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.73rem;font-weight:700}
.pt{background:var(--teal2);color:var(--teal)}
.pn{background:rgba(27,58,107,.11);color:var(--navy2)}
.pg{background:var(--g2);color:var(--g6)}

/* ── FILTROS ── */
.filt{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}
.filt input,.filt select{padding:6px 10px;font-size:.85rem;border-radius:7px;border:1.5px solid var(--g2);width:auto}

/* ── KPI ── */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px;margin-bottom:18px}
.kpi{background:var(--w);border-radius:9px;padding:15px;box-shadow:var(--sh);border-left:4px solid var(--teal)}
.kpi.a{border-left-color:var(--navy2)}
.kl{font-size:.72rem;color:var(--g6);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.kv{font-size:1.45rem;font-weight:700;color:var(--navy2);margin-top:3px}

/* ── CHARTS ── */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.cc{background:var(--w);border-radius:9px;padding:16px;box-shadow:var(--sh)}
.cc h4{font-size:.83rem;font-weight:700;color:var(--navy2);margin-bottom:11px}
.cc canvas{max-height:220px}

/* ── PRM ── */
.ptabs{display:flex;gap:7px;margin-bottom:14px}
.ptab{background:var(--g1);border:none;padding:7px 17px;border-radius:20px;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--g6);transition:.18s}
.ptab.act{background:var(--teal);color:var(--navy)}
.cpanel{background:var(--g1);border-radius:8px;padding:13px;margin-bottom:13px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.cpanel label{font-size:.82rem;font-weight:700;color:var(--navy2)}

/* ── CIERRE MODO TABS ── */
.ctabs{display:flex;gap:6px;margin-bottom:14px}
.ctab{background:var(--g1);border:none;padding:6px 15px;border-radius:20px;cursor:pointer;font-size:.83rem;font-weight:700;color:var(--g6);transition:.18s}
.ctab.act{background:var(--navy2);color:#fff}

/* ── MODAL ── */
.mov{position:fixed;inset:0;background:rgba(11,22,40,.6);z-index:1000;display:none;align-items:center;justify-content:center;padding:14px}
.mov.open{display:flex}
.mbox{background:var(--w);border-radius:13px;padding:26px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shl)}
.mtit{font-size:1rem;font-weight:700;color:var(--navy2);margin-bottom:18px}
.mfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}

/* ── TOAST ── */
#toast{position:fixed;bottom:22px;right:22px;background:var(--navy2);color:#fff;padding:11px 18px;border-radius:9px;font-size:.88rem;font-weight:600;z-index:9999;transform:translateY(70px);opacity:0;transition:.28s;box-shadow:var(--shl)}
#toast.show{transform:translateY(0);opacity:1}
#toast.ok{border-left:4px solid var(--teal)}
#toast.err{border-left:4px solid var(--red)}

/* ── PACIENTE SUMMARY ── */
.psumm{background:var(--g1);border-radius:8px;padding:13px;margin-bottom:11px}
.pname{font-weight:700;color:var(--navy2);font-size:1rem}
.pmeta{font-size:.8rem;color:var(--g6);margin-top:2px}

@media(max-width:600px){.fg{grid-template-columns:1fr}.cgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- OVERLAY MODO -->
<div id="overlay-modo">
  <div class="modo-card">
    <h1>UMANA <span style="color:var(--teal)">Ginecología</span></h1>
    <p>Selecciona el modo de acceso</p>
    <div class="modo-btns">
      <button class="modo-btn p" id="btn-op">🔐 Modo Operativo</button>
      <button class="modo-btn s" id="btn-co">👁 Modo Consulta</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="hl">
      <div class="logo">UMANA <span>Ginecología</span></div>
      <div class="badge" id="badge-modo">–</div>
      <div class="dot r" id="sync-dot" style="display:none" title="Sync activo"></div>
    </div>
    <div class="hr">
      <div class="dot r" id="sess-dot"></div>
      <button id="sess-btn">Sin sesión ▾</button>
      <div class="sess-dd" id="sess-dd">
        <button id="btn-logout">🚪 Cerrar sesión</button>
      </div>
    </div>
  </header>

  <div id="banner">⚠️ Sesión caída <button id="btn-reconectar">Reconectar</button></div>

  <nav id="main-nav">
    <button class="act" data-tab="registro">📋 Registro</button>
    <button data-tab="historial">📂 Historial</button>
    <button data-tab="cierre">📊 Cierre</button>
    <button data-tab="prm">💬 PRM</button>
    <button data-tab="excel" style="margin-left:auto">⬇ Excel</button>
  </nav>

  <div id="consulta-bar">
    <label>Doctor:</label>
    <select id="consulta-dr">
      <option value="">Todos</option>
      <option>Dr. Eduardo Serratos</option>
      <option>Dra. Cynthia Dickter</option>
      <option>Dra. Paulina Chabat</option>
      <option>Dr. Carlos Lopez</option>
      <option>Dra. Ana Isabel Gandara</option>
    </select>
  </div>

  <main>

    <!-- ══ REGISTRO ══ -->
    <div id="tab-registro" class="tab-pane">
      <div class="card">
        <div class="ct">Nueva Consulta / Servicio</div>
        <div class="fg">
          <div class="fi"><label class="lbl">Fecha *</label><input type="date" id="r-fecha"/></div>
          <div class="fi"><label class="lbl">Doctor *</label>
            <select id="r-doctor">
              <option value="">— Seleccionar —</option>
              <option>Dr. Eduardo Serratos</option><option>Dra. Cynthia Dickter</option>
              <option>Dra. Paulina Chabat</option><option>Dr. Carlos Lopez</option>
              <option>Dra. Ana Isabel Gandara</option>
            </select>
          </div>
          <div class="fi"><label class="lbl">Paciente *</label>
            <input type="text" id="r-paciente" placeholder="Nombre completo" list="dl-pacientes"/>
            <datalist id="dl-pacientes"></datalist>
          </div>
          <div class="fi"><label class="lbl">Tipo de servicio *</label>
            <select id="r-tipo">
              <option value="">— Seleccionar —</option>
              <option>Primera Vez</option><option>Subsecuente</option>
              <option>Procedimiento</option><option>Laboratorio</option><option>Producto Farmacia</option>
            </select>
          </div>
          <div class="fi full" id="r-desc-wrap" style="display:none">
            <label class="lbl" id="r-desc-lbl">Descripción *</label>
            <input type="text" id="r-desc"/>
          </div>
          <div class="fi"><label class="lbl">Monto *</label>
            <div class="mon"><span>$</span><input type="number" id="r-monto" min="0" step="0.01" placeholder="0.00"/></div>
          </div>
          <div class="fi"><label class="lbl">Medio de pago *</label>
            <select id="r-pago">
              <option value="">— Seleccionar —</option>
              <option>Tarjeta</option><option>Efectivo</option><option>Transferencia</option><option>Cortesía</option>
            </select>
          </div>
          <div class="fi full">
            <button class="btn-add2" id="r-btn-add2">+ 2do pago</button>
            <div class="wrap2" id="r-wrap2">
              <button class="rm2" id="r-btn-rm2">✕</button>
              <div class="prow">
                <div class="fi"><label class="lbl">2do Monto</label>
                  <div class="mon"><span>$</span><input type="number" id="r-monto2" min="0" step="0.01" placeholder="0.00"/></div>
                </div>
                <div class="fi"><label class="lbl">2do Medio de pago</label>
                  <select id="r-pago2">
                    <option value="">— Seleccionar —</option>
                    <option>Tarjeta</option><option>Efectivo</option><option>Transferencia</option><option>Cortesía</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          <div class="fi full"><label class="lbl">Notas / Observaciones</label>
            <textarea id="r-notas" placeholder="Opcional..."></textarea>
          </div>
        </div>
        <div class="fac">
          <label class="cbrow"><input type="checkbox" id="r-factura"/><span>¿Requiere factura?</span></label>
          <div id="r-nfact-wrap" style="display:none;margin-top:10px">
            <label class="lbl">No. de factura (opcional)</label>
            <input type="text" id="r-nfact" placeholder="Ej. F-0042"/>
          </div>
        </div>
        <div style="margin-top:16px;display:flex;gap:10px">
          <button class="btn btn-p" id="btn-guardar">Guardar registro</button>
          <button class="btn btn-s" id="btn-limpiar">Limpiar</button>
        </div>
      </div>
    </div>

    <!-- ══ HISTORIAL ══ -->
    <div id="tab-historial" class="tab-pane" style="display:none">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;flex-wrap:wrap;gap:8px">
          <div class="ct" style="margin:0">Historial de consultas</div>
          <div style="display:flex;gap:7px">
            <button class="btn btn-sm btn-s" id="h-btn-tabla">📋 Tabla</button>
            <button class="btn btn-sm btn-s" id="h-btn-pac">👤 Por paciente</button>
          </div>
        </div>
        <div class="filt">
          <input type="date" id="h-fi"/><input type="date" id="h-ff"/>
          <select id="h-doctor">
            <option value="">Todos los doctores</option>
            <option>Dr. Eduardo Serratos</option><option>Dra. Cynthia Dickter</option>
            <option>Dra. Paulina Chabat</option><option>Dr. Carlos Lopez</option>
            <option>Dra. Ana Isabel Gandara</option>
          </select>
          <input type="text" id="h-buscar" placeholder="🔍 Paciente..."/>
          <select id="h-tipo">
            <option value="">Todos los tipos</option>
            <option>Primera Vez</option><option>Subsecuente</option>
            <option>Procedimiento</option><option>Laboratorio</option><option>Producto Farmacia</option>
          </select>
        </div>
        <div id="historial-cont"></div>
      </div>
    </div>

    <!-- ══ CIERRE ══ -->
    <div id="tab-cierre" class="tab-pane" style="display:none">
      <div class="card">
        <div class="ct">Dashboard de Cierre</div>
        <div class="ctabs">
          <button class="ctab act" data-cm="dia">Día</button>
          <button class="ctab" data-cm="mes">Mes</button>
          <button class="ctab" data-cm="rango">Rango</button>
        </div>
        <div id="cierre-filtros" style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px"></div>
        <div id="cierre-cont"></div>
      </div>
    </div>

    <!-- ══ PRM ══ -->
    <div id="tab-prm" class="tab-pane" style="display:none">
      <div class="card">
        <div class="ct">Patient Relationship Management</div>
        <div class="ptabs">
          <button class="ptab act" data-pt="inactivos">😴 Inactivos</button>
          <button class="ptab" data-pt="recompra">🔄 Recompra</button>
        </div>
        <div id="prm-inactivos">
          <div class="cpanel">
            <label>Días sin visita:</label>
            <input type="number" id="prm-umbral" value="60" min="1" style="width:65px"/>
            <button class="btn btn-sm btn-p" id="btn-prm-apply">Aplicar</button>
          </div>
          <div id="prm-inact-cont"></div>
        </div>
        <div id="prm-recompra" style="display:none">
          <div class="cpanel" style="flex-direction:column;align-items:flex-start">
            <b style="font-size:.88rem;color:var(--navy2)">Catálogo de productos</b>
            <div id="cat-list" style="width:100%;margin-top:8px"></div>
            <div style="display:flex;gap:7px;margin-top:8px;flex-wrap:wrap">
              <input type="text" id="cat-nom" placeholder="Nombre del producto" style="width:auto;flex:1;min-width:160px"/>
              <input type="number" id="cat-dias" placeholder="Días" style="width:80px" min="1"/>
              <button class="btn btn-sm btn-p" id="btn-cat-add">+ Agregar</button>
            </div>
          </div>
          <div id="prm-recomp-cont"></div>
        </div>
      </div>
    </div>

  </main>
</div><!-- /app -->

<!-- MODAL EDITAR -->
<div class="mov" id="mov-edit">
  <div class="mbox">
    <div class="mtit">✏️ Editar registro</div>
    <div class="fg">
      <div class="fi"><label class="lbl">Fecha *</label><input type="date" id="e-fecha"/></div>
      <div class="fi"><label class="lbl">Doctor *</label>
        <select id="e-doctor">
          <option value="">— Seleccionar —</option>
          <option>Dr. Eduardo Serratos</option><option>Dra. Cynthia Dickter</option>
          <option>Dra. Paulina Chabat</option><option>Dr. Carlos Lopez</option>
          <option>Dra. Ana Isabel Gandara</option>
        </select>
      </div>
      <div class="fi"><label class="lbl">Paciente *</label><input type="text" id="e-paciente"/></div>
      <div class="fi"><label class="lbl">Tipo de servicio *</label>
        <select id="e-tipo">
          <option value="">— Seleccionar —</option>
          <option>Primera Vez</option><option>Subsecuente</option>
          <option>Procedimiento</option><option>Laboratorio</option><option>Producto Farmacia</option>
        </select>
      </div>
      <div class="fi full" id="e-desc-wrap" style="display:none">
        <label class="lbl" id="e-desc-lbl">Descripción *</label>
        <input type="text" id="e-desc"/>
      </div>
      <div class="fi"><label class="lbl">Monto *</label>
        <div class="mon"><span>$</span><input type="number" id="e-monto" min="0" step="0.01"/></div>
      </div>
      <div class="fi"><label class="lbl">Medio de pago *</label>
        <select id="e-pago">
          <option value="">— Seleccionar —</option>
          <option>Tarjeta</option><option>Efectivo</option><option>Transferencia</option><option>Cortesía</option>
        </select>
      </div>
      <div class="fi full">
        <button class="btn-add2" id="e-btn-add2">+ 2do pago</button>
        <div class="wrap2" id="e-wrap2">
          <button class="rm2" id="e-btn-rm2">✕</button>
          <div class="prow">
            <div class="fi"><label class="lbl">2do Monto</label>
              <div class="mon"><span>$</span><input type="number" id="e-monto2" min="0" step="0.01"/></div>
            </div>
            <div class="fi"><label class="lbl">2do Medio de pago</label>
              <select id="e-pago2">
                <option value="">— Seleccionar —</option>
                <option>Tarjeta</option><option>Efectivo</option><option>Transferencia</option><option>Cortesía</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="fi full"><label class="lbl">Notas</label><textarea id="e-notas"></textarea></div>
    </div>
    <div class="fac" style="margin-top:13px">
      <label class="cbrow"><input type="checkbox" id="e-factura"/><span>¿Requiere factura?</span></label>
      <div id="e-nfact-wrap" style="display:none;margin-top:9px">
        <label class="lbl">No. de factura</label><input type="text" id="e-nfact"/>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btn-s" id="e-btn-cancel">Cancelar</button>
      <button class="btn btn-p" id="e-btn-save">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- MODAL MENSAJE -->
<div class="mov" id="mov-msg">
  <div class="mbox">
    <div class="mtit">💬 Mensaje personalizado</div>
    <textarea id="msg-txt" style="width:100%;min-height:130px;font-size:.91rem;border:1.5px solid var(--g2);border-radius:8px;padding:11px"></textarea>
    <div class="mfoot">
      <button class="btn btn-s" id="msg-btn-close">Cerrar</button>
      <button class="btn btn-p" id="msg-btn-copy">📋 Copiar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════
const CLIENT_ID = 'acec6a91-246d-4682-a192-b22b0fb4ea97';
const FOLDER    = 'UMANA';
const FILE      = 'umana_data.json';
const SCOPES    = ['Files.ReadWrite','User.Read'];
const MSALCFG   = {
  auth:{ clientId:CLIENT_ID, authority:'https://login.microsoftonline.com/common', redirectUri:window.location.origin },
  cache:{ cacheLocation:'sessionStorage', storeAuthStateInCookie:false }
};
const TIPOS_DESC = ['Procedimiento','Laboratorio','Producto Farmacia'];
const DESC_LABEL = { Procedimiento:'Nombre del procedimiento', Laboratorio:'Nombre del estudio', 'Producto Farmacia':'Nombre del producto' };
const COLORS = ['#2ABFBF','#1B3A6B','#0B1628','#3dd9d9','#22488a','#94a3b8'];

// ══════════════════════════════════════════════
// ESTADO
// ══════════════════════════════════════════════
let transactions = [];
let _msal = null, _token = null, _mode = null, _editId = null;
let _hView = 'tabla', _cMode = 'dia', _pTab = 'inactivos';
let _catalog = JSON.parse(localStorage.getItem('umana_cat')||'[]');
if (!_catalog.length) _catalog = [
  {name:'Pastillas anticonceptivas',dias:28},
  {name:'Óvulos vaginales',dias:14},
  {name:'Gel lubricante',dias:30}
];

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
const $ = id => document.getElementById(id);
const show = id => { $(id).style.display = 'block'; };
const hide = id => { $(id).style.display = 'none'; };
const showF = id => { $(id).style.display = 'flex'; };
const fmt = n => '$'+(n||0).toLocaleString('es-MX',{minimumFractionDigits:2});
const fmtF = f => { if(!f)return'—';const[y,m,d]=f.split('-');return`${d}/${m}/${y}`; };

function toast(msg, type='ok') {
  const el=$('toast'); el.textContent=msg; el.className='show '+type;
  setTimeout(()=>{el.className=''},3200);
}

// ══════════════════════════════════════════════
// MODO SELECTOR
// ══════════════════════════════════════════════
function entrarModo(mode) {
  _mode = mode;
  hide('overlay-modo');
  show('app');
  $('badge-modo').textContent = mode==='operativo' ? '🔐 Operativo' : '👁 Consulta';
  $('sync-dot').style.display = 'inline-block';
  if (mode === 'consulta') {
    // ocultar tabs Registro y PRM en nav
    document.querySelectorAll('#main-nav button')[0].style.display = 'none';
    document.querySelectorAll('#main-nav button')[3].style.display = 'none';
    $('consulta-bar').style.display = 'flex';
    switchTab('historial');
  } else {
    setHoy();
    switchTab('registro');
  }
}

// ══════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════
function switchTab(name) {
  document.querySelectorAll('.tab-pane').forEach(p => p.style.display='none');
  document.querySelectorAll('#main-nav button[data-tab]').forEach(b => b.classList.remove('act'));
  const pane = $('tab-'+name);
  if (pane) pane.style.display = 'block';
  const btn = document.querySelector(`#main-nav button[data-tab="${name}"]`);
  if (btn) btn.classList.add('act');
  if (name==='historial') renderHistorial();
  if (name==='cierre') initCierre();
  if (name==='prm') { renderPrmInact(); renderCatalog(); }
}

// ══════════════════════════════════════════════
// FORM HELPERS
// ══════════════════════════════════════════════
function setHoy() {
  const hoy = new Date().toISOString().split('T')[0];
  const rf = $('r-fecha'); if(rf) rf.value = hoy;
}

function updDescWrap(tipo, wrapId, lblId, inputId) {
  if (TIPOS_DESC.includes(tipo)) {
    show(wrapId); $(lblId).textContent = DESC_LABEL[tipo]+' *'; $(inputId).placeholder = DESC_LABEL[tipo];
  } else {
    hide(wrapId); $(inputId).value = '';
  }
}

function cortesiaLogic(pagoId, montoId) {
  const v = $(pagoId).value, m = $(montoId);
  if (v==='Cortesía') { m.value=''; m.disabled=true; m.style.background='var(--g1)'; }
  else { m.disabled=false; m.style.background=''; }
}

// ══════════════════════════════════════════════
// GUARDAR REGISTRO
// ══════════════════════════════════════════════
function guardar() {
  const fecha  = $('r-fecha').value;
  const doc    = $('r-doctor').value;
  const pac    = $('r-paciente').value.trim();
  const tipo   = $('r-tipo').value;
  const desc   = $('r-desc').value.trim();
  const monto  = $('r-monto').value;
  const pago   = $('r-pago').value;
  const notas  = $('r-notas').value.trim();
  const fac    = $('r-factura').checked;
  const nfact  = $('r-nfact').value.trim();
  const hay2   = $('r-wrap2').style.display !== 'none';
  const monto2 = hay2 ? $('r-monto2').value : '';
  const pago2  = hay2 ? $('r-pago2').value  : '';

  if (!fecha||!doc||!pac||!tipo||!pago) { toast('Completa todos los campos obligatorios.','err'); return; }
  if (TIPOS_DESC.includes(tipo) && !desc) { toast('La descripción es obligatoria.','err'); return; }
  if (pago!=='Cortesía' && (!monto||parseFloat(monto)<0)) { toast('Ingresa el monto.','err'); return; }
  if (hay2 && !pago2) { toast('Selecciona el 2do medio de pago.','err'); return; }
  if (hay2 && pago2!=='Cortesía' && (!monto2||parseFloat(monto2)<0)) { toast('Ingresa el 2do monto.','err'); return; }

  transactions.push({
    id: Date.now().toString(),
    fecha, doctor:doc, paciente:pac, tipo,
    descripcion: TIPOS_DESC.includes(tipo) ? desc : '',
    monto: pago==='Cortesía' ? 0 : parseFloat(monto)||0,
    pago,
    monto2: (hay2 && pago2!=='Cortesía') ? parseFloat(monto2)||0 : 0,
    pago2: hay2 ? pago2 : '',
    notas, factura:fac, numFactura:nfact,
    ts: new Date().toISOString()
  });
  updDL(); fullSync(); limpiar(); toast('Registro guardado ✓','ok');
}

function limpiar() {
  ['r-paciente','r-notas','r-desc','r-nfact','r-monto','r-monto2'].forEach(id=>$(id).value='');
  ['r-doctor','r-tipo','r-pago','r-pago2'].forEach(id=>$(id).value='');
  hide('r-desc-wrap'); $('r-factura').checked=false; hide('r-nfact-wrap');
  $('r-wrap2').style.display='none'; $('r-btn-add2').style.display='';
  $('r-monto').disabled=false; $('r-monto').style.background='';
  setHoy();
}

function updDL() {
  const names = [...new Set(transactions.map(t=>t.paciente).filter(Boolean))].sort();
  $('dl-pacientes').innerHTML = names.map(n=>`<option value="${n}">`).join('');
}

// ══════════════════════════════════════════════
// HISTORIAL
// ══════════════════════════════════════════════
function renderHistorial() {
  const fi  = $('h-fi').value, ff=$('h-ff').value;
  const dr  = _mode==='consulta' ? $('consulta-dr').value : $('h-doctor').value;
  const bus = ($('h-buscar').value||'').toLowerCase();
  const tp  = $('h-tipo').value;
  let txs = [...transactions].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if (fi) txs=txs.filter(t=>t.fecha>=fi);
  if (ff) txs=txs.filter(t=>t.fecha<=ff);
  if (dr) txs=txs.filter(t=>t.doctor===dr);
  if (bus) txs=txs.filter(t=>t.paciente.toLowerCase().includes(bus));
  if (tp) txs=txs.filter(t=>t.tipo===tp);
  const c = $('historial-cont');
  if (!txs.length) { c.innerHTML='<p style="color:var(--g4);text-align:center;padding:22px">Sin registros.</p>'; return; }
  if (_hView==='paciente') renderHPac(txs,c); else renderHTabla(txs,c);
}

function renderHTabla(txs,c) {
  const op = _mode==='operativo';
  c.innerHTML = `<div class="twrap"><table>
    <thead><tr><th>Fecha</th><th>Doctor</th><th>Paciente</th><th>Tipo</th><th>Descripción</th><th>Monto</th><th>Pago</th><th>Factura</th>${op?'<th></th>':''}</tr></thead>
    <tbody>${txs.map(t=>{
      const tot = t.monto+(t.monto2||0);
      const cort = t.pago==='Cortesía'&&(!t.pago2||t.pago2==='Cortesía');
      return `<tr>
        <td>${fmtF(t.fecha)}</td>
        <td><span class="pill pn">${t.doctor}</span></td>
        <td><b>${t.paciente}</b></td>
        <td><span class="pill pt">${t.tipo}</span></td>
        <td>${t.descripcion||'—'}</td>
        <td>${cort?'<span class="pill pg">Cortesía</span>':fmt(tot)}</td>
        <td>${t.pago}${t.pago2?' + '+t.pago2:''}</td>
        <td>${t.factura?'✅ '+(t.numFactura||''):'—'}</td>
        ${op?`<td><button class="bico" data-edit="${t.id}">✏️</button><button class="bico" data-del="${t.id}">🗑️</button></td>`:''}
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
  c.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>abrirEdit(b.dataset.edit)));
  c.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>eliminar(b.dataset.del)));
}

function renderHPac(txs,c) {
  const byP = {};
  txs.forEach(t=>{ if(!byP[t.paciente])byP[t.paciente]=[]; byP[t.paciente].push(t); });
  c.innerHTML = Object.keys(byP).sort().map(p=>{
    const pts=byP[p], tot=pts.reduce((s,t)=>s+t.monto+(t.monto2||0),0);
    return `<div class="psumm">
      <div class="pname">${p}</div>
      <div class="pmeta">Visitas: ${pts.length} · Última: ${fmtF(pts[0].fecha)} · Total: ${fmt(tot)}</div>
      <div class="twrap" style="margin-top:9px"><table>
        <thead><tr><th>Fecha</th><th>Doctor</th><th>Tipo</th><th>Monto</th><th>Pago</th></tr></thead>
        <tbody>${pts.map(t=>`<tr><td>${fmtF(t.fecha)}</td><td>${t.doctor}</td><td>${t.tipo}</td><td>${fmt(t.monto+(t.monto2||0))}</td><td>${t.pago}${t.pago2?' + '+t.pago2:''}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  }).join('');
}

function eliminar(id) {
  if (!confirm('¿Eliminar este registro?')) return;
  transactions = transactions.filter(t=>t.id!==id);
  fullSync(); renderHistorial(); toast('Eliminado.','ok');
}

// ══════════════════════════════════════════════
// EDITAR
// ══════════════════════════════════════════════
function abrirEdit(id) {
  const t = transactions.find(x=>x.id===id); if(!t)return;
  _editId = id;
  $('e-fecha').value=t.fecha; $('e-doctor').value=t.doctor;
  $('e-paciente').value=t.paciente; $('e-tipo').value=t.tipo;
  updDescWrap(t.tipo,'e-desc-wrap','e-desc-lbl','e-desc');
  $('e-desc').value=t.descripcion||'';
  $('e-monto').value=t.monto; $('e-pago').value=t.pago;
  cortesiaLogic('e-pago','e-monto');
  $('e-notas').value=t.notas||'';
  $('e-factura').checked=t.factura||false;
  $('e-nfact').value=t.numFactura||'';
  $('e-nfact-wrap').style.display=t.factura?'block':'none';
  if (t.pago2) {
    $('e-wrap2').style.display='block'; $('e-btn-add2').style.display='none';
    $('e-monto2').value=t.monto2||0; $('e-pago2').value=t.pago2;
    cortesiaLogic('e-pago2','e-monto2');
  } else {
    $('e-wrap2').style.display='none'; $('e-btn-add2').style.display='';
  }
  $('mov-edit').classList.add('open');
}

function guardarEdit() {
  const t = transactions.find(x=>x.id===_editId); if(!t)return;
  const tipo=($('e-tipo').value), pago=($('e-pago').value);
  const hay2=$('e-wrap2').style.display!=='none', pago2=hay2?$('e-pago2').value:'';
  t.fecha=$('e-fecha').value; t.doctor=$('e-doctor').value;
  t.paciente=$('e-paciente').value.trim(); t.tipo=tipo;
  t.descripcion=TIPOS_DESC.includes(tipo)?$('e-desc').value.trim():'';
  t.monto=pago==='Cortesía'?0:parseFloat($('e-monto').value)||0; t.pago=pago;
  t.monto2=(hay2&&pago2!=='Cortesía')?parseFloat($('e-monto2').value)||0:0; t.pago2=hay2?pago2:'';
  t.notas=$('e-notas').value.trim(); t.factura=$('e-factura').checked;
  t.numFactura=$('e-nfact').value.trim(); t.editedAt=new Date().toISOString();
  fullSync(); $('mov-edit').classList.remove('open'); renderHistorial(); toast('Guardado ✓','ok');
}

// ══════════════════════════════════════════════
// CIERRE
// ══════════════════════════════════════════════
function initCierre() {
  setCMode(_cMode);
}

function setCMode(mode) {
  _cMode=mode;
  document.querySelectorAll('.ctab').forEach(b=>b.classList.remove('act'));
  document.querySelector(`.ctab[data-cm="${mode}"]`).classList.add('act');
  const cf=$('cierre-filtros'); const hoy=new Date().toISOString().split('T')[0];
  if (mode==='dia') cf.innerHTML=`<input type="date" id="c-fecha" value="${hoy}" onchange="renderCierre()"/>`;
  else if (mode==='mes') cf.innerHTML=`<input type="month" id="c-mes" value="${hoy.slice(0,7)}" onchange="renderCierre()"/>`;
  else cf.innerHTML=`<input type="date" id="c-ini" onchange="renderCierre()"/> <input type="date" id="c-fin" onchange="renderCierre()"/>`;
  renderCierre();
}

function getTxsCierre() {
  let txs=[...transactions];
  if (_cMode==='dia') { const f=$('c-fecha')?.value; if(f)txs=txs.filter(t=>t.fecha===f); }
  else if (_cMode==='mes') { const m=$('c-mes')?.value; if(m)txs=txs.filter(t=>t.fecha.startsWith(m)); }
  else { const i=$('c-ini')?.value,ff=$('c-fin')?.value; if(i)txs=txs.filter(t=>t.fecha>=i); if(ff)txs=txs.filter(t=>t.fecha<=ff); }
  return txs;
}

function renderCierre() {
  const txs=getTxsCierre(), c=$('cierre-cont');
  if (!txs.length) { c.innerHTML='<p style="color:var(--g4);text-align:center;padding:22px">Sin datos para el período.</p>'; return; }
  const total=txs.reduce((s,t)=>s+t.monto+(t.monto2||0),0);
  const pacs=[...new Set(txs.map(t=>t.paciente))].length;
  const corts=txs.filter(t=>t.pago==='Cortesía').length;
  const noC=txs.filter(t=>t.pago!=='Cortesía').length;
  const ticket=noC?total/noC:0;
  const byDoc={}, byPago={}, byTipo={};
  txs.forEach(t=>{
    if(!byDoc[t.doctor])byDoc[t.doctor]={total:0,count:0,pacs:new Set()};
    byDoc[t.doctor].total+=t.monto+(t.monto2||0); byDoc[t.doctor].count++; byDoc[t.doctor].pacs.add(t.paciente);
    byPago[t.pago]=(byPago[t.pago]||0)+t.monto;
    if(t.pago2)byPago[t.pago2]=(byPago[t.pago2]||0)+(t.monto2||0);
    byTipo[t.tipo]=(byTipo[t.tipo]||0)+1;
  });
  const trend={};
  const d30=new Date(); d30.setDate(d30.getDate()-30);
  transactions.filter(t=>new Date(t.fecha)>=d30).forEach(t=>{trend[t.fecha]=(trend[t.fecha]||0)+t.monto+(t.monto2||0);});
  const tD=Object.keys(trend).sort(), tV=tD.map(d=>trend[d]);

  // Destroy old charts
  ['ch-doc','ch-pago','ch-tipo','ch-trend'].forEach(id=>{ const el=document.getElementById(id); if(el){ const ch=Chart.getChart(el); if(ch)ch.destroy(); } });

  c.innerHTML=`
    <div class="kgrid">
      <div class="kpi"><div class="kl">Total ingresos</div><div class="kv">${fmt(total)}</div></div>
      <div class="kpi"><div class="kl">Pacientes únicos</div><div class="kv">${pacs}</div></div>
      <div class="kpi"><div class="kl">Consultas</div><div class="kv">${txs.length}</div></div>
      <div class="kpi a"><div class="kl">Ticket promedio</div><div class="kv">${isFinite(ticket)?fmt(ticket):'—'}</div></div>
      <div class="kpi"><div class="kl">Cortesías</div><div class="kv">${corts}</div></div>
    </div>
    <div class="cgrid">
      <div class="cc"><h4>Ingresos por doctor</h4><canvas id="ch-doc"></canvas></div>
      <div class="cc"><h4>Métodos de pago</h4><canvas id="ch-pago"></canvas></div>
      <div class="cc"><h4>Tipos de servicio</h4><canvas id="ch-tipo"></canvas></div>
      <div class="cc"><h4>Tendencia 30 días</h4><canvas id="ch-trend"></canvas></div>
    </div>
    <div style="margin-top:4px"><div class="ct">Detalle por doctor</div>
    <div class="twrap"><table>
      <thead><tr><th>Doctor</th><th>Consultas</th><th>Pacientes</th><th>Total</th></tr></thead>
      <tbody>${Object.entries(byDoc).sort((a,b)=>b[1].total-a[1].total).map(([d,v])=>
        `<tr><td><b>${d}</b></td><td>${v.count}</td><td>${v.pacs.size}</td><td>${fmt(v.total)}</td></tr>`
      ).join('')}</tbody>
    </table></div></div>`;

  const dL=Object.keys(byDoc), dV=dL.map(d=>byDoc[d].total);
  new Chart($('ch-doc'),{type:'bar',data:{labels:dL.map(l=>l.replace(/Dr[a]?\. /,'')),datasets:[{data:dV,backgroundColor:COLORS}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'$'+v.toLocaleString('es-MX')}}}}});
  new Chart($('ch-pago'),{type:'doughnut',data:{labels:Object.keys(byPago),datasets:[{data:Object.values(byPago),backgroundColor:COLORS}]},options:{plugins:{legend:{position:'bottom'}}}});
  new Chart($('ch-tipo'),{type:'bar',data:{labels:Object.keys(byTipo),datasets:[{data:Object.values(byTipo),backgroundColor:COLORS}]},options:{plugins:{legend:{display:false}},indexAxis:'y'}});
  if(tD.length) new Chart($('ch-trend'),{type:'line',data:{labels:tD,datasets:[{data:tV,borderColor:'#2ABFBF',backgroundColor:'rgba(42,191,191,.12)',fill:true,tension:.3,pointRadius:3}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'$'+v.toLocaleString('es-MX')}}}}});
}

// ══════════════════════════════════════════════
// PRM
// ══════════════════════════════════════════════
function setPTab(tab) {
  _pTab=tab;
  document.querySelectorAll('.ptab').forEach(b=>b.classList.remove('act'));
  document.querySelector(`.ptab[data-pt="${tab}"]`).classList.add('act');
  $('prm-inactivos').style.display=tab==='inactivos'?'block':'none';
  $('prm-recompra').style.display=tab==='recompra'?'block':'none';
  if(tab==='recompra'){renderCatalog();renderPrmRecomp();}
}

function renderPrmInact() {
  const umbral=parseInt($('prm-umbral').value)||60;
  const now=new Date(), byP={};
  transactions.forEach(t=>{ if(!byP[t.paciente]||t.fecha>byP[t.paciente].fecha)byP[t.paciente]=t; });
  const rows=Object.values(byP).map(t=>({...t,dias:Math.floor((now-new Date(t.fecha))/86400000)})).filter(t=>t.dias>=umbral).sort((a,b)=>b.dias-a.dias);
  const c=$('prm-inact-cont');
  if(!rows.length){c.innerHTML=`<p style="color:var(--g4);text-align:center;padding:20px">Sin inactivos >${umbral} días.</p>`;return;}
  c.innerHTML=`<div class="twrap"><table>
    <thead><tr><th>Paciente</th><th>Última visita</th><th>Días sin venir</th><th>Doctor</th><th></th></tr></thead>

function renderCatalog() {
  $('cat-list').innerHTML=_catalog.map((p,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--g2)">
    <span style="flex:1;font-size:.86rem">${p.name}</span>

function saveCat() { localStorage.setItem('umana_cat',JSON.stringify(_catalog)); }

function addCat() {
  const n=$('cat-nom').value.trim(), d=parseInt($('cat-dias').value)||30;
  if(!n)return; _catalog.push({name:n,dias:d}); $('cat-nom').value=''; $('cat-dias').value=''; renderCatalog(); renderPrmRecomp();
}

function renderPrmRecomp() {
  const now=new Date(), rows=[];
  transactions.filter(t=>t.tipo==='Producto Farmacia'&&t.descripcion).forEach(t=>{
    const cat=_catalog.find(p=>t.descripcion.toLowerCase().includes(p.name.toLowerCase()));
    if(!cat)return;
    const vence=new Date(new Date(t.fecha).getTime()+cat.dias*86400000);
    const dv=Math.floor((now-vence)/86400000);
    if(dv>=0)rows.push({...t,producto:t.descripcion,diasCiclo:cat.dias,diasVencido:dv});
  });
  rows.sort((a,b)=>b.diasVencido-a.diasVencido);
  const c=$('prm-recomp-cont');
  if(!rows.length){c.innerHTML='<p style="color:var(--g4);text-align:center;padding:16px">Sin ciclos vencidos.</p>';return;}
  c.innerHTML=`<div class="twrap"><table>
    <thead><tr><th>Paciente</th><th>Producto</th><th>Compra</th><th>Ciclo</th><th>Vencido</th><th></th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td><b>${r.paciente}</b></td><td>${r.producto}</td><td>${fmtF(r.fecha)}</td>
      <td>${r.diasCiclo}d</td>
      <td><span class="pill" style="background:#fee2e2;color:#dc2626">${r.diasVencido}d</span></td>
      <td><button class="btn btn-sm btn-p" data-pr="${encodeURIComponent(JSON.stringify({tipo:'recompra',p:r.paciente,f:r.fecha,d:r.doctor,prod:r.producto}))}">💬</button></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
  c.querySelectorAll('[data-pr]').forEach(b=>b.addEventListener('click',()=>{ const o=JSON.parse(decodeURIComponent(b.dataset.pr)); abrirMsg(o); }));
}

function abrirMsg(o) {
  let msg='';
  if(o.tipo==='inactivo') msg=`Hola ${o.p}, te saludamos de parte de UMANA Ginecología. Notamos que hace un tiempo no nos visitas y queremos saber cómo estás. El equipo de ${o.d} está disponible para atenderte cuando gustes. ¿Te gustaría agendar una cita? 💙`;
  else msg=`Hola ${o.p}, te saludamos de UMANA Ginecología. Tu ciclo de ${o.prod} está por concluir o ya venció. Si necesitas una nueva dosis o tienes dudas, ${o.d} y el equipo de UMANA están aquí para apoyarte. ¿Agendamos? 💙`;
  $('msg-txt').value=msg; $('mov-msg').classList.add('open');
}

// EXCEL
// ══════════════════════════════════════════════
function exportExcel() {
  if(!transactions.length){toast('Sin datos.','err');return;}
  const wb=XLSX.utils.book_new();
  const nh={fill:{patternType:'solid',fgColor:{rgb:'1B3A6B'}},font:{bold:true,color:{rgb:'FFFFFF'},sz:10},alignment:{horizontal:'center'}};
  const nt={fill:{patternType:'solid',fgColor:{rgb:'2ABFBF'}},font:{bold:true,color:{rgb:'0B1628'},sz:10},alignment:{horizontal:'center'}};

  const h1=['Fecha','Doctor','Paciente','Tipo servicio','Descripción','Monto','2do Monto','2do Pago','Medio de pago','Factura (Sí/No)','No. Factura','Notas'];
  const r1=transactions.map(t=>[t.fecha,t.doctor,t.paciente,t.tipo,t.descripcion||'',t.monto,t.monto2||'',t.pago2||'',t.pago,t.factura?'Sí':'No',t.numFactura||'',t.notas||'']);
  const ws1=XLSX.utils.aoa_to_sheet([h1,...r1]);
  h1.forEach((_,i)=>{const c=XLSX.utils.encode_cell({r:0,c:i});if(ws1[c])ws1[c].s=nh;});
  ws1['!cols']=[10,22,20,16,22,10,10,12,14,14,12,20].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws1,'Transacciones');

  const byP={};
  transactions.forEach(t=>{if(!byP[t.paciente])byP[t.paciente]={v:0,tot:0,ult:'',docs:new Set()};byP[t.paciente].v++;byP[t.paciente].tot+=t.monto+(t.monto2||0);if(!byP[t.paciente].ult||t.fecha>byP[t.paciente].ult)byP[t.paciente].ult=t.fecha;byP[t.paciente].docs.add(t.doctor);});
  const h2=['Paciente','Visitas','Total','Última visita','Doctores'];
  const r2=Object.entries(byP).sort((a,b)=>b[1].tot-a[1].tot).map(([p,d])=>[p,d.v,d.tot,d.ult,[...d.docs].join(', ')]);
  const ws2=XLSX.utils.aoa_to_sheet([h2,...r2]);
  h2.forEach((_,i)=>{const c=XLSX.utils.encode_cell({r:0,c:i});if(ws2[c])ws2[c].s=nh;});
  ws2['!cols']=[{wch:22},{wch:8},{wch:14},{wch:12},{wch:30}];
  XLSX.utils.book_append_sheet(wb,ws2,'Pacientes');

  const byT={};transactions.forEach(t=>{if(!byT[t.tipo])byT[t.tipo]={n:0,tot:0};byT[t.tipo].n++;byT[t.tipo].tot+=t.monto+(t.monto2||0);});
  const h3=['Tipo','Consultas','Total'];
  const ws3=XLSX.utils.aoa_to_sheet([h3,...Object.entries(byT).map(([k,v])=>[k,v.n,v.tot])]);
  h3.forEach((_,i)=>{const c=XLSX.utils.encode_cell({r:0,c:i});if(ws3[c])ws3[c].s=nt;});
  ws3['!cols']=[{wch:20},{wch:10},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws3,'Por tipo de servicio');

  const byDoc={};transactions.forEach(t=>{if(!byDoc[t.doctor])byDoc[t.doctor]={n:0,tot:0,pacs:new Set()};byDoc[t.doctor].n++;byDoc[t.doctor].tot+=t.monto+(t.monto2||0);byDoc[t.doctor].pacs.add(t.paciente);});
  const h4=['Doctor','Consultas','Pacientes','Total'];
  const ws4=XLSX.utils.aoa_to_sheet([h4,...Object.entries(byDoc).sort((a,b)=>b[1].tot-a[1].tot).map(([d,v])=>[d,v.n,v.pacs.size,v.tot])]);
  h4.forEach((_,i)=>{const c=XLSX.utils.encode_cell({r:0,c:i});if(ws4[c])ws4[c].s=nh;});
  ws4['!cols']=[{wch:26},{wch:10},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws4,'Por personal');

  const byM={};transactions.forEach(t=>{const m=t.fecha.slice(0,7);if(!byM[m])byM[m]={n:0,tot:0,pacs:new Set()};byM[m].n++;byM[m].tot+=t.monto+(t.monto2||0);byM[m].pacs.add(t.paciente);});
  const h5=['Mes','Consultas','Pacientes','Total'];
  const ws5=XLSX.utils.aoa_to_sheet([h5,...Object.entries(byM).sort().map(([m,v])=>[m,v.n,v.pacs.size,v.tot])]);
  h5.forEach((_,i)=>{const c=XLSX.utils.encode_cell({r:0,c:i});if(ws5[c])ws5[c].s=nt;});
  ws5['!cols']=[{wch:10},{wch:10},{wch:10},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws5,'Cierres históricos');

  XLSX.writeFile(wb,'UMANA_Reporte.xlsx');
  toast('Excel generado ✓','ok');
}

// MSAL / ONEDRIVE
// ══════════════════════════════════════════════
async function getToken() {
  const accs=_msal.getAllAccounts();
  if(!accs.length)return null;
  try {
    const r=await _msal.acquireTokenSilent({scopes:SCOPES,account:accs[0]});
    _token=r.accessToken; return _token;
  } catch(e) {
    try {
      const r=await _msal.acquireTokenSilent({scopes:SCOPES,account:accs[0],forceRefresh:true});
      _token=r.accessToken; return _token;
    } catch(e2) { showBanner(true); return null; }
  }
}

function showBanner(show) { $('banner').style.display=show?'block':'none'; }

function setSessUI(ok,label) {
  $('sess-dot').className='dot '+(ok?'g':'r');
  $('sess-btn').childNodes[0].textContent=label+' ▾';
  showBanner(!ok);
}

async function loadFromOneDrive() {
  const t=await getToken(); if(!t)return;
  try {
    const url=`https://graph.microsoft.com/v1.0/me/drive/root:/${FOLDER}/${FILE}:/content`;
    const r=await fetch(url,{headers:{Authorization:'Bearer '+t}});
    if(r.ok){
      const d=await r.json();
      if(d&&Array.isArray(d.transactions)&&d.transactions.length>0){
        transactions=d.transactions; updDL(); renderHistorial();
      }
    }
  } catch(e){console.warn('load err',e);}
}

async function fullSync() {
  if(!transactions.length)return;
  const t=await getToken(); if(!t)return;
  try {
    const data=JSON.stringify({transactions,updatedAt:new Date().toISOString()});
    const url=`https://graph.microsoft.com/v1.0/me/drive/root:/${FOLDER}/${FILE}:/content`;
    await fetch(url,{method:'PUT',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:data});
    const now=new Date(), ds=now.toISOString().split('T')[0], hr=now.getHours().toString().padStart(2,'0');
    const h={Authorization:'Bearer '+t,'Content-Type':'application/json'};
    fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${FOLDER}/backups/umana_${ds}.json:/content`,{method:'PUT',headers:h,body:data});
    fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${FOLDER}/backups/umana_${ds}_${hr}.json:/content`,{method:'PUT',headers:h,body:data});
  } catch(e){console.warn('sync err',e);}
}

async function renewToken() {
  const t=await getToken(); if(!t)showBanner(true);
}

async function msalLogout() {
  const accs=_msal.getAllAccounts();
  if(accs.length) await _msal.logoutRedirect({account:accs[0]});
}

// BOOT
// ══════════════════════════════════════════════
window.addEventListener('load', async () => {
  _msal = new msal.PublicClientApplication(MSALCFG);
  await _msal.initialize();
  try {
    const resp = await _msal.handleRedirectPromise();
    if (resp && resp.account) _msal.setActiveAccount(resp.account);
  } catch(e) { console.warn('redirect err', e); }

  const accs = _msal.getAllAccounts();
  if (!accs.length) {
    await _msal.loginRedirect({scopes:SCOPES});
    return;
  }

  const t = await getToken();
  if (t) {
    setSessUI(true, accs[0].username||accs[0].name||'Usuario');
    await loadFromOneDrive();
  } else {
    setSessUI(false, 'Sin sesión');
  }

  setInterval(async ()=>{ await loadFromOneDrive(); if(_mode)renderHistorial(); }, 60000);
  setInterval(renewToken, 45*60*1000);
});
